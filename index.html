<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120807">
<title>疯狂火世界</title>
<!-- 字体非阻塞加载：国内网络加载不到时直接用系统字体，不会卡住页面 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Chakra+Petch:wght@500;700&display=swap" media="print" onload="this.media='all'">
<style>
  :root{
    --bg:#120807;--bg2:#1C0E0B;--line:#3D241C;--line2:#5A3A30;--ink:#FFF1E6;--dim:#C2A193;--warm:#FFD7C2;
    --ice:#8BEBFF;--ice2:#EAFBFF;--iceDeep:#1E6F8A;--panel:#0E1A20;--panelLine:#2E5F72;--iceInk:#06151B;
    --fire:#FF5A1F;--amber:#FFB020;--gold:#FFD24A;--red:#F0304A;--mag:#FF4FD8;
    --f-title:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif;
    --f-num:"Chakra Petch",ui-monospace,"SF Mono",system-ui,sans-serif;
    --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
    color-scheme:dark
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;
    font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  canvas{display:block;touch-action:none}
  #probe{position:fixed;visibility:hidden;pointer-events:none;padding:var(--sat) var(--sar) var(--sab) var(--sal)}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
  b{font-weight:700}

  .screen{position:fixed;inset:0;display:none;flex-direction:column;overflow-y:auto;
    padding:calc(var(--sat) + 20px) max(16px,var(--sar)) calc(var(--sab) + 20px) max(16px,var(--sal));background:rgba(18,8,7,.92)}
  .screen.on{display:flex}
  .wrap{width:100%;max-width:520px;margin:auto;display:flex;flex-direction:column;gap:14px}
  .wrap.center{align-items:stretch;text-align:center;max-width:360px}
  .ht{font-family:var(--f-title);font-weight:400;font-size:34px;line-height:1.1;color:var(--ice)}
  .kick{font-size:12px;letter-spacing:.2em;color:var(--dim)}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  .head>div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
  .coin{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-num);font-weight:700;color:var(--gold);font-size:28px;font-variant-numeric:tabular-nums}
  .coin::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--gold);box-shadow:inset -3px -3px 0 #C99A1A;flex:none}
  .coinpill{padding:6px 12px;background:#1A1608;border:1px solid #5A4A12}
  .coinpill .coin{font-size:24px}
  .num{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}

  .btn{height:56px;padding:0 20px;border:0;background:var(--ice);color:var(--iceInk);font-size:18px;font-weight:900;letter-spacing:.08em;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
    display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
  .btn:active{transform:scale(.97)}
  .btn.fire{background:var(--fire);color:#120807}
  .btn.big{height:64px;font-size:26px;letter-spacing:.4em;padding-left:calc(20px + .4em)}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line2);clip-path:none;font-weight:400;font-size:15px;letter-spacing:0}
  .btn small{font-family:var(--f-num);font-size:12px;font-weight:700;letter-spacing:0;color:var(--fire)}
  .btn[disabled]{opacity:.4;cursor:default;transform:none}
  .actions{display:flex;gap:10px}
  .actions .btn:not(.ghost){flex:1}
  .actions .btn.ghost{flex:none}
  .keys{color:var(--dim);font-size:12px;text-align:center;line-height:2}
  .keys kbd{font-family:var(--f-num);font-size:12px;color:var(--ink);padding:2px 7px;border:1px solid var(--line2);border-bottom-width:3px;margin:0 2px}
  .hint{font-size:12px;color:var(--warm);text-align:center}
  @media (pointer:coarse){.fine{display:none!important}}
  @media (pointer:fine){.coarse{display:none!important}}

  /* 标题页 */
  #s-title{background:rgba(18,8,7,.8);padding-bottom:0;overflow-x:hidden}
  .t-top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:1}
  .ver{font-family:var(--f-num);font-size:12px;letter-spacing:.2em;color:var(--dim)}
  .sets{display:flex;gap:8px}
  .ico{width:44px;height:44px;border:1px solid var(--line);background:var(--bg2);display:flex;align-items:center;justify-content:center}
  .ico span{display:none}
  .ico svg,.set svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ico.on{color:var(--ice)}.ico.off{color:var(--dim)}
  .t-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;width:100%;max-width:1080px;margin:0 auto;position:relative;z-index:1;padding:12px 0}
  .t-left{display:flex;flex-direction:column;gap:18px;min-width:0}
  .kicker{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.2em;color:var(--dim)}
  .kicker i{width:22px;height:2px;background:var(--fire)}
  h1{font-family:var(--f-title);font-weight:400;font-size:clamp(56px,min(23vw,17vh),150px);line-height:.92;color:var(--fire);text-shadow:.04em .04em 0 var(--iceDeep);letter-spacing:.02em}
  .tape{align-self:flex-start;transform:rotate(-2deg);padding:5px;background:repeating-linear-gradient(-45deg,var(--amber) 0 10px,var(--bg) 10px 20px)}
  .tape div{background:var(--bg);padding:8px 14px;font-size:clamp(17px,4.6vw,26px);font-weight:900}
  .tape em{font-style:normal;color:var(--amber)}
  .t-recs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:460px}
  .t-recs div{display:flex;flex-direction:column;gap:2px}
  .t-recs b{font-family:var(--f-num);font-size:22px}
  .t-recs span,.t-first{font-size:12px;color:var(--dim)}
  .t-hero{align-self:center;width:min(220px,52vw);aspect-ratio:1;max-width:100%;position:relative}
  .t-hero svg{width:100%;height:100%;overflow:visible}
  .t-bottom{display:flex;flex-direction:column;gap:10px;width:100%;max-width:460px;margin:0 auto;position:relative;z-index:1;padding-bottom:calc(var(--sab) + 28px)}
  .flames{position:fixed;left:0;right:0;bottom:0;width:100%;height:120px;pointer-events:none}
  @media (min-width:820px) and (min-aspect-ratio:1/1){
    .t-main{flex-direction:row;align-items:center;justify-content:space-between}
    .t-hero{width:min(380px,34vw,52vh)}
    .t-bottom{margin:0;margin-left:max(0px,calc((100% - 1080px)/2))}
  }
  @media (max-height:520px) and (min-aspect-ratio:1/1){
    .t-main{flex-direction:row;align-items:center;gap:16px;padding:4px 0}
    h1{font-size:64px}
    .t-left{gap:10px}
    .t-hero{width:150px}
    .t-bottom{flex-direction:row;align-items:center;max-width:none;margin:0;padding-bottom:calc(var(--sab) + 12px)}
    .t-bottom .btn.big{width:260px;height:56px;font-size:22px}
    .flames{height:70px}
  }

  /* 暂停 */
  .setrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .set{height:64px;flex-direction:column;gap:4px;font-size:12px;padding:0 4px}
  .set.on{color:var(--ice);border-color:var(--panelLine)}
  .set.off{color:var(--dim)}

  /* 选技能卡 */
  .earn{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:6px;text-align:center}
  .earn div{background:var(--bg2);padding:6px 2px;display:flex;flex-direction:column}
  .earn b{font-family:var(--f-num);font-size:16px;color:var(--gold)}
  .earn span{font-size:11px;color:var(--dim)}
  .bonus{font-size:13px;color:var(--ice);background:var(--panel);border:1px solid var(--panelLine);padding:8px 10px}
  .bonus:empty{display:none}
  .odds{display:flex;flex-direction:column;gap:6px}
  .odds .row{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
  .odds .row b{font-family:var(--f-num);color:var(--ink)}
  .obar{display:flex;height:10px;gap:2px}
  .olg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px}
  .cards{display:flex;flex-direction:column;gap:10px}
  .card{text-align:left;padding:14px;background:var(--qb);border:2px solid var(--qc);display:flex;gap:14px;align-items:center;transition:transform .1s}
  .card.sel{box-shadow:0 0 0 3px var(--ice);transform:scale(1.015)}
  .cic{flex:none;width:56px;height:56px;background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--sc)}
  .cic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .cbody{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
  .crow{display:flex;align-items:center;gap:8px}
  .cname{font-size:18px}
  .chip{font-size:11px;color:#120807;background:var(--sc);padding:0 6px}
  .cq{margin-left:auto;font-size:11px;font-weight:700;color:var(--ql)}
  .ctext{font-size:14px;line-height:1.5}
  .ctext b{font-family:var(--f-num);color:var(--ql2)}
  .ccost{font-size:12px;color:#FF8A8A}
  .clv{font-size:11px;color:var(--dim)}
  .none{color:var(--dim);font-size:14px;text-align:center;padding:24px;border:1px dashed var(--line2)}
  @media (prefers-reduced-motion:reduce){.card{transition:none}.card.sel{transform:none}}

  /* 冰窖商店 */
  #s-shop{background:rgba(11,20,24,.96);color:var(--ice2)}
  #s-shop .kick{color:#8FB5C2}
  .bag{display:flex;align-items:center;gap:10px}
  .bag>span:first-child{font-size:12px;color:#8FB5C2}
  .slots{display:flex;gap:6px}
  .slot{width:44px;height:44px;border:1.5px dashed var(--panelLine);display:flex;align-items:center;justify-content:center;position:relative;font-family:var(--f-num);font-size:12px;color:#5F8A99}
  .slot.full{border:1.5px solid var(--ice);background:var(--panel);color:var(--ice)}
  .slot svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .slot i{position:absolute;right:-6px;top:-6px;min-width:17px;height:17px;border-radius:9px;background:var(--ice);color:var(--iceInk);font-style:normal;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}
  .slot u{position:absolute;left:2px;top:0;font-size:10px;text-decoration:none;color:#8FB5C2}
  .pips{margin-left:auto;display:flex;gap:3px;align-items:center}
  .pip{width:14px;height:14px;background:var(--ice);transform:rotate(45deg) scale(.8)}
  .pip.e{background:none;border:2px solid var(--panelLine)}
  .shelves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .shelves .shelf:last-child:nth-child(odd){grid-column:1/-1}
  .shelf{padding:12px;background:#102029;border:1px solid var(--panelLine);display:flex;flex-direction:column;gap:8px;position:relative;color:var(--sc)}
  .shelf.feat{flex-direction:row;align-items:center;gap:14px;border:2px solid var(--ice);background:#0F2630;margin-top:6px}
  .shelf.feat .sic{flex:none;width:56px;height:56px;background:#0B1418;display:flex;align-items:center;justify-content:center}
  .shelf.feat .smid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .shelf.feat .buy{flex:none;width:76px}
  .ribbon{position:absolute;right:-2px;top:-12px;background:var(--amber);color:#120807;font-size:11px;font-weight:700;padding:2px 8px}
  .srow{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
  .shelf svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .stag{font-size:11px;color:#8FB5C2;text-align:right}
  .sname{font-size:15px;color:var(--ice2)}
  .sdesc{font-size:12px;line-height:1.5;color:#B5D6E0;flex:1}
  .scost{font-size:12px;color:#FF8A8A}
  .buy{height:46px;border:0;background:var(--gold);color:#120807;font-family:var(--f-num);font-weight:700;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .buy s{font-size:11px;color:#6A5410}
  .buy[disabled]{background:transparent;border:1.5px solid var(--line2);color:#FF8A8A;font-size:14px;cursor:default}
  .buy.sold{color:#8FB5C2;border-color:var(--panelLine)}
  .kbd{position:absolute;left:6px;bottom:4px;font-family:var(--f-num);font-size:10px;color:#5F8A99}
  .shelf.feat .kbd{left:auto;right:84px}

  /* 结算 */
  .melt{display:flex;flex-direction:column;align-items:center;gap:6px}
  .melt svg{width:120px;height:60px}
  .melt .ht{color:var(--fire);font-size:48px;text-shadow:3px 3px 0 var(--iceDeep)}
  .stamp{align-self:center;transform:rotate(-3deg);border:3px solid var(--red);padding:6px 18px;color:var(--red);font-size:22px;font-weight:900;letter-spacing:.06em;text-align:center}
  .miss{text-align:center;display:flex;flex-direction:column;gap:2px}
  .miss:empty{display:none}
  .miss span{font-size:14px;color:var(--dim)}
  .miss b{font-family:var(--f-num);font-size:64px;line-height:1;color:var(--amber)}
  .miss b small{font-size:24px}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .grid2 div{background:var(--bg2);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
  .grid2 span{font-size:11px;color:var(--dim)}
  .grid2 b{font-family:var(--f-num);font-size:22px}
  .rec{font-size:13px;color:var(--gold);text-align:center}
  .build{display:flex;flex-wrap:wrap;gap:6px}
  .build span{font-size:12px;padding:3px 8px;border:1px solid var(--qc);color:var(--ql)}
  #d-share{width:100%;font:inherit;font-size:13px;line-height:1.6;color:var(--warm);background:var(--bg2);border:1px dashed var(--line2);padding:10px 12px;resize:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="probe"></div>

<div id="s-title" class="screen on">
  <svg class="flames" viewBox="0 0 390 150" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 150 L0 80 L30 50 L60 90 L95 30 L130 85 L165 55 L200 95 L240 40 L275 90 L310 60 L350 100 L390 45 L390 150 Z" fill="#2A0E08"/>
    <path d="M0 150 L0 115 L50 90 L100 125 L150 95 L210 130 L270 100 L330 128 L390 105 L390 150 Z" fill="#4A1509"/>
    <path d="M0 150 L0 138 L90 128 L190 142 L290 130 L390 140 L390 150 Z" fill="#7A2410"/>
  </svg>
  <div class="t-top">
    <span class="ver">V0.4</span>
    <div class="sets"><button class="ico coarse" data-set="drag"></button><button class="ico" data-set="mute"></button><button class="ico" data-set="music"></button><button class="ico" data-set="lowfx"></button></div>
  </div>
  <div class="t-main">
    <div class="t-left">
      <div class="kicker"><i></i>不能攻击 · 只能躲 · 越险越赚</div>
      <h1>疯狂<br>火世界</h1>
      <div class="tape"><div>你来，你也过不了<em>第二关</em>。</div></div>
      <div id="t-rec"></div>
    </div>
    <div class="t-hero" aria-hidden="true">
      <svg viewBox="-20 -10 240 230">
        <circle cx="100" cy="100" r="98" fill="none" stroke="#FF5A1F" stroke-width="2" stroke-dasharray="7 7" opacity=".5"/>
        <g transform="translate(25 22) scale(1.5)">
          <ellipse cx="50" cy="91" rx="30" ry="5" fill="#000" opacity=".45"/>
          <path d="M22 34 L50 48 L50 86 L22 70 Z" fill="#9BE9FB" stroke="#9BE9FB" stroke-width="5" stroke-linejoin="round"/>
          <path d="M50 48 L78 34 L78 70 L50 86 Z" fill="#3FB6DA" stroke="#3FB6DA" stroke-width="5" stroke-linejoin="round"/>
          <path d="M22 34 L50 20 L78 34 L50 48 Z" fill="#EAFBFF" stroke="#EAFBFF" stroke-width="5" stroke-linejoin="round"/>
          <path d="M30 32 L44 25" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <circle cx="32" cy="58" r="3.4" fill="#0B2530"/><circle cx="43" cy="63" r="3.4" fill="#0B2530"/>
          <path d="M34 68 Q37.5 71 41 69.5" stroke="#0B2530" stroke-width="2" fill="none" stroke-linecap="round"/>
          <ellipse cx="28" cy="64" rx="3" ry="1.8" fill="#FF9BB0" opacity=".7"/>
          <path d="M68 74 Q72 84 68 88 Q64 84 68 74 Z" fill="#8BEBFF"/>
        </g>
        <g transform="translate(-28 48) scale(.48)"><path d="M50 8 C68 32 82 48 78 68 A28 28 0 0 1 22 68 C18 48 34 36 50 8 Z" fill="#FF5A1F"/><path d="M50 40 C60 54 66 60 63 72 A13 13 0 0 1 37 72 C35 62 42 54 50 40 Z" fill="#FFB020"/><path d="M38 62 L46 65 M62 62 L54 65" stroke="#120807" stroke-width="4" stroke-linecap="round"/></g>
        <g transform="translate(176 128) scale(.58)"><path d="M50 8 C68 32 82 48 78 68 A28 28 0 0 1 22 68 C18 48 34 36 50 8 Z" fill="#F0304A"/><path d="M50 40 C60 54 66 60 63 72 A13 13 0 0 1 37 72 C35 62 42 54 50 40 Z" fill="#FF5A1F"/><path d="M38 62 L46 65 M62 62 L54 65" stroke="#120807" stroke-width="4" stroke-linecap="round"/></g>
        <text x="150" y="26" transform="rotate(-8 150 26)" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="17" fill="#8BEBFF" stroke="#06151B" stroke-width="3" paint-order="stroke">擦弹 ×3</text>
      </svg>
    </div>
  </div>
  <div class="t-bottom">
    <button class="btn big" id="b-start">开始</button>
    <div class="keys fine"><kbd>WASD</kbd>移动　<kbd>空格</kbd>冲刺　<kbd>Q</kbd><kbd>E</kbd><kbd>R</kbd>道具　<kbd>Esc</kbd>暂停　<kbd>回车</kbd>开始</div>
    <div class="hint coarse">横屏更好玩 · 按住屏幕任意处拖动移动</div>
  </div>
</div>

<div id="s-pause" class="screen">
  <div class="wrap center">
    <h2 class="ht">暂停</h2>
    <button class="btn big" id="b-resume">继续</button>
    <div class="setrow"><button class="btn ghost set" data-set="mute"></button><button class="btn ghost set" data-set="music"></button><button class="btn ghost set" data-set="lowfx"></button></div>
    <button class="btn ghost set coarse" data-set="drag"></button>
    <button class="btn ghost" id="b-quit">放弃本局</button>
  </div>
</div>

<div id="s-up" class="screen">
  <div class="wrap">
    <div class="head"><div><span class="kick" id="u-kick">撑过来了</span><h2 class="ht" id="u-title"></h2></div><span class="coin" id="u-total"></span></div>
    <div class="earn" id="u-earn"></div>
    <div class="bonus" id="u-bonus"></div>
    <div class="odds" id="u-odds"></div>
    <div class="cards" id="u-cards"></div>
    <div class="actions"><button class="btn ghost" id="b-reroll"></button><button class="btn" id="b-pick"></button></div>
    <div class="keys fine">按 <kbd>1</kbd>–<kbd>4</kbd> 直接选择　<kbd>R</kbd> 重抽</div>
  </div>
</div>

<div id="s-shop" class="screen">
  <div class="wrap">
    <div class="head"><div><span class="kick" id="sh-next"></span><h2 class="ht">冰窖商店</h2></div><div class="coinpill"><span class="coin" id="sh-coins"></span></div></div>
    <div class="bag" id="sh-inv"></div>
    <div id="sh-feature"></div>
    <div class="shelves" id="sh-shelves"></div>
    <div class="actions"><button class="btn ghost" id="b-refresh"></button><button class="btn fire" id="b-go"></button></div>
    <div class="keys fine">按 <kbd>1</kbd>–<kbd>5</kbd> 购买　<kbd>R</kbd> 刷新　<kbd>回车</kbd> 出发</div>
  </div>
</div>

<div id="s-dead" class="screen">
  <div class="wrap">
    <div class="melt">
      <svg viewBox="0 0 120 60" aria-hidden="true">
        <ellipse cx="60" cy="46" rx="54" ry="11" fill="#1E6F8A"/><ellipse cx="60" cy="43" rx="46" ry="8" fill="#3FB6DA"/>

<script>
'use strict';
// ───────── 基础工具 ─────────
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const settings = Object.assign({ mute: false, music: true, lowfx: false, drag: true }, store.get('xc_settings', {}));

// ───────── 画布与坐标 ─────────
const cv = $('c'), ctx = cv.getContext('2d', { alpha: false });
let W = 1100, H = 640, SC = 1, OX = 0, OY = 0, DPR = 1, VW = 0, VH = 0;
let INS = { t: 0, r: 0, b: 0, l: 0 }, HUDT = 0, CTLB = 0;
const isCoarse = () => touchMode || matchMedia('(pointer: coarse)').matches;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = innerWidth; VH = innerHeight;
  cv.width = VW * DPR; cv.height = VH * DPR;
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  // 刘海、手势条等安全区，从 CSS env() 读出来
  const cs = getComputedStyle($('probe'));
  INS = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  // 手机竖屏：顶部留给 HUD，底部留给冲刺和道具按钮，场地不被数字和拇指挡住
  const band = VW < VH && isCoarse();
  HUDT = band ? INS.t + 84 : 0;
  CTLB = band ? INS.b + 150 : 0;
  const AW = VW, AH = Math.max(200, VH - HUDT - CTLB);
  // 竖屏用较短的短边，让手机上的物体更大
  const S = AW >= AH ? 640 : 520;
  if (AW >= AH) { H = S; W = clamp(S * AW / AH, S, S * 1.9); }
  else { W = S; H = clamp(S * AH / AW, S, S * 1.9); }
  SC = Math.min(AW / W, AH / H);
  OX = (AW - W * SC) / 2; OY = HUDT + (AH - H * SC) / 2;
  if (P) { P.x = clamp(P.x, P.r, W - P.r); P.y = clamp(P.y, P.r, H - P.r); }
}

// ───────── 音效（Web Audio 合成）─────────
let AC = null, master = null;
function audioInit() {

  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = settings.mute ? 0 : .45; master.connect(AC.destination);
    musicInit();
  } catch (e) { AC = null; }
}
function tone(f, dur, type = 'sine', vol = .2, slide = 1, delay = 0) {
  if (!AC || settings.mute) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(1e-4, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
let noiseBuf = null;
function getNoise() {
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}
function noise(dur, vol = .3, freq = 800, type = 'lowpass', t = 0, dest = null) {
  if (!AC || settings.mute) return;
  t = t || AC.currentTime;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = getNoise(); f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(1e-4, t + dur);
  s.connect(f); f.connect(g); g.connect(dest || master); s.start(t, Math.random() * .5, dur + .05);
}
const sfx = {
  graze: c => { const f = 620 * Math.pow(2, Math.min(c, 24) / 12); tone(f, .13, 'triangle', .15); tone(f * 2, .08, 'sine', .05); },
  hurt: () => { noise(.35, .45, 900); tone(200, .35, 'sawtooth', .16, .35); },
  shieldBreak: () => { tone(1500, .25, 'square', .05, .4); noise(.18, .2, 5000); },
  shieldUp: () => tone(700, .18, 'sine', .1, 2),

  beaconOn: () => [0, 4, 7, 12].forEach((s, i) => tone(330 * Math.pow(2, s / 12), .28, 'sawtooth', .07, 1, i * .06)),

// ───────── 背景音乐：D 弗里几亚调式，程序生成 ─────────
let musicGain = null, musicFilter = null;
const mus = { next: 0, step: 0, bar: 0, bpm: 96 };
function musicInit() {
  musicFilter = AC.createBiquadFilter(); musicFilter.type = 'lowpass'; musicFilter.frequency.value = 16000;
  musicGain = AC.createGain(); musicGain.gain.value = settings.music ? .32 : 0;
  musicFilter.connect(musicGain); musicGain.connect(master);

}
const semi = s => 73.42 * Math.pow(2, s / 12);
function mnote(f, t, dur, type, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(1e-4, t + dur);
  o.connect(g); g.connect(musicFilter); o.start(t); o.stop(t + dur + .02);
}
function kick(t, v) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(38, t + .12);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(1e-4, t + .25);
  o.connect(g); g.connect(musicFilter); o.start(t); o.stop(t + .3);
}
function musicTick() {
  if (!AC || AC.state !== 'running' || settings.mute || !settings.music) return;
  const playing = G && G.state === 'play';
  const target = playing ? Math.min(180, Math.min(172, 126 + 3 * (G.round - 1)) + (G.boss ? 10 : 0)) : 96;
  mus.bpm += (target - mus.bpm) * .03;
  const lowHp = playing && P.hp === 1;
  musicFilter.frequency.setTargetAtTime(lowHp ? 900 : playing ? 16000 : 1600, AC.currentTime, .3);
  if (mus.next < AC.currentTime - .2) mus.next = AC.currentTime + .05;
  while (mus.next < AC.currentTime + .12) {
    musicStep(mus.next, mus.step, playing);
    mus.next += 60 / mus.bpm / 4;
    mus.step = (mus.step + 1) % 16; if (!mus.step) mus.bar++;
  }
}
function musicStep(t, s, playing) {
  if (!playing) {
    // 菜单 / 选卡 / 商店：只留低沉的低音脉冲
    if (s % 4 === 0) mnote(semi([0, 0, 1, -2][mus.bar % 4]), t, .5, 'sawtooth', .05);
    if (s === 0) kick(t, .22);
    return;
  }
  const left = G.len - G.t, intense = left < 10 || !!G.boss;
  if (s % 4 === 0) kick(t, .55);
  if (s === 4 || s === 12) noise(.12, .16, 1800, 'bandpass', t, musicFilter);
  if (intense || s % 2 === 0) noise(.04, s % 4 === 2 ? .07 : .035, 7000, 'highpass', t, musicFilter);
  if (s % 2 === 0) mnote(semi([0, 0, 1, 0, 0, 0, -2, -2][s / 2]), t, .14, 'sawtooth', .11);
  if (G.round >= 2 || enemies.length > capNow() * .6 || G.beaconActive)
    mnote(semi([0, 3, 7, 1][s % 4] + 24 + (G.beaconActive ? 12 : 0)), t, .09, 'square', .028);
  if (G.boss && mus.bar % 2 === 0 && s % 4 === 0 && s < 12)
    mnote(semi([0, 1, 7][s / 4] + 24 + (G.boss.heat / G.boss.max < .3 ? 12 : 0)), t, .35, 'triangle', .08);
  if (P.hp === 1 && (s === 0 || s === 3)) mnote(55, t, .15, 'sine', .3);
  if (left < 5 && s % 4 === 0) mnote(880 * Math.pow(2, Math.floor(5 - left) / 12), t, .08, 'square', .03);
}

      drawJoy(ox, oy, ox, oy, .4);
    }
    if (!joy && G.round === 1 && G.t < 8) {
      ctx.globalAlpha = Math.min(1, (8 - G.t) / 1.5); ctx.fillStyle = '#ffd7c2'; ctx.font = FONT(12); ctx.textAlign = 'left';
      ctx.fillText(settings.drag ? '在空白处按住滑动，小冰块跟着手指走' : '按住任意处拖动摇杆', INS.l + 14, VH - INS.b - 20); ctx.globalAlpha = 1;
    }
  } else {
    // 电脑：左下冲刺环，底部中间 Q/E/R 三格
    const dx = INS.l + 48, dy = VH - INS.b - 48;
    ctx.globalAlpha = .85; ctx.fillStyle = '#0e1a20'; disc(dx, dy, 32); ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle = '#2e5f72'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = '#8bebff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(dx, dy, 30, -1.57, -1.57 + cdk * TAU); ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillStyle = cdk >= 1 ? '#fff1e6' : '#8c6e62'; ctx.font = FONT(12); ctx.fillText('冲刺', dx, dy + 1);
    ctx.fillStyle = '#9fd3e2'; ctx.font = NUM(10); ctx.fillText('空格', dx, dy + 15);
    const sw = 92, sh = 66, gap = 10, sx0 = cx - (3 * sw + 2 * gap) / 2, sy = VH - INS.b - 16 - sh;
    for (let i = 0; i < 3; i++) {
      const x = sx0 + i * (sw + gap), s = G.inv[i];
      if (s) {
        const c = s.k === 'zero' ? '#ff4fd8' : '#8bebff', locked = s.k === 'zero' && G.zeroUsed;
        ctx.globalAlpha = locked ? .4 : .88; ctx.fillStyle = '#0e1a20'; ctx.fillRect(x, sy, sw, sh);
        ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.strokeRect(x + 1, sy + 1, sw - 2, sh - 2);
        ctx.fillStyle = c; ctx.fillRect(x, sy, 18, 16);
        ctx.fillStyle = '#06151b'; ctx.textAlign = 'center'; ctx.font = NUM(11); ctx.fillText(SLOT_KEYS[i], x + 9, sy + 12);
        drawIcon(s.k, x + sw / 2, sy + 26, 24, c, 2);
        ctx.fillStyle = '#fff1e6'; ctx.font = FONT(11); ctx.fillText(CONS[s.k].name, x + sw / 2, sy + 56);
        ctx.textAlign = 'right'; ctx.fillStyle = c; ctx.font = NUM(12); ctx.fillText('×' + s.n, x + sw - 6, sy + 14);
      } else {
        ctx.globalAlpha = .7; ctx.setLineDash([5, 4]); ctx.strokeStyle = '#5a3a30'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, sy + 1, sw - 2, sh - 2); ctx.setLineDash([]);
        ctx.fillStyle = '#3d241c'; ctx.fillRect(x, sy, 18, 16);
        ctx.fillStyle = '#c2a193'; ctx.textAlign = 'center'; ctx.font = NUM(11); ctx.fillText(SLOT_KEYS[i], x + 9, sy + 12);
        ctx.fillStyle = '#8c6e62'; ctx.font = FONT(11); ctx.fillText('空', x + sw / 2, sy + 38);
      }
      ctx.globalAlpha = 1;
    }
  }
}
// 标题画面背景：漂浮的火苗
const attract = Array.from({ length: 26 }, () => ({ x: Math.random(), y: Math.random(), vx: rand(-.02, .02), vy: rand(-.05, -.01), r: rand(8, 16), seed: Math.random() * 10 }));
function drawAttract() {
  G = { time: performance.now() / 1000 };
  for (const a of attract) {
    a.x = (a.x + a.vx / 60 + 1) % 1; a.y = (a.y + a.vy / 60 + 1) % 1;
    ctx.globalAlpha = .45; flame(a.x * VW, a.y * VH, a.r, -Math.PI / 2, FLAME.ember, a.seed);
  }
  G = null; ctx.globalAlpha = 1;
}

// ───────── 界面 ─────────
function showScreen(id) { for (const s of ['s-title', 's-pause', 's-up', 's-shop', 's-dead']) $(s).classList.toggle('on', s === id); }
function start() { audioInit(); joy = null; keys.clear(); newGame(); }
function pause() { G.state = 'pause'; joy = null; showScreen('s-pause'); }
function resume() { G.state = 'play'; showScreen(null); }
let upSel = 0;
function showUpgrade() {
  const E = G.earn;
  upSel = 0;
  $('u-kick').textContent = G.boss ? (G.boss.cooled ? 'Boss 被冷却了' : 'Boss 撑过去了') : '撑过来了';
  $('u-title').textContent = G.boss ? G.boss.name : `第 ${G.round} 关 完成`;
  $('u-total').textContent = '+' + E.total;
  const src = [[E.time, `存活 ${Math.round(G.len)}s`], [E.threat, '威胁'], [E.graze, `擦弹 ×${G.rs.grazes}`], [E.beacon, '信标'], [E.clear, '过关'], [E.boss, 'Boss']];
  $('u-earn').innerHTML = src.filter(s => s[0] >= 1).map(([v, l]) => `<div><b>+${Math.floor(v)}</b><span>${l}</span></div>`).join('');
  $('u-bonus').textContent = [G.bonus, G.gotReroll ? '贴险出色，获得 1 次重抽' : ''].filter(Boolean).join(' · ');
  const o = qualOdds(G.risk), QC = ['#8C7A72', '#FFB347', '#FF4FD8'];
  $('u-odds').innerHTML = `<div class="row"><span>风险评分 <b>${G.risk.toFixed(2)}</b></span><span>持有 <b>${G.coins}</b> 金币 · 生命 <b>${P.hp}/${P.maxHp}</b></span></div>
    <div class="obar">${o.map((v, i) => v > 0 ? `<div style="flex:${v};background:${QC[i]}"></div>` : '').join('')}</div>
    <div class="olg">${QUAL.map((q, i) => `<span style="color:${i ? QC[i] : '#C2A193'}">${q.n} ${pct(o[i])}</span>`).join('')}</div>`;
  renderCards();
  showScreen('s-up');
}
function renderCards() {
  $('u-cards').innerHTML = G.offers.map((f, i) => {
    const c = CARD[f.id], q = QUAL[f.q], st = QSTYLE[f.q], v = c.val(f.L, q.m);
    const txt = c.text(v, f.L).replace(/[+\-]?\d+(\.\d+)?%?/g, m => `<b>${m}</b>`);
    return `<button type="button" class="card${i === upSel ? ' sel' : ''}" aria-pressed="${i === upSel}" data-i="${i}"
      style="--qc:${st.b};--qb:${st.bg};--ql:${st.l};--ql2:${st.v};--sc:${SCHOOL_C[c.school]}">
      <span class="cic">${svgIcon('c_' + c.id)}</span>
      <span class="cbody">
        <span class="crow"><b class="cname">${c.name}</b><span class="chip">${c.school}</span><span class="cq">${q.n}${f.q ? ' ×' + q.m.toFixed(2) : ''}</span></span>
        <span class="ctext">${txt}</span>
        ${c.costText ? `<span class="ccost">代价：${c.costText(f.L)}</span>` : ''}
        <span class="clv">${f.from >= 0 ? `Lv ${LV[f.from]} → ${LV[f.L]}` : '新技能 · Lv I'}<span class="fine"> · 按 ${i + 1}</span></span>
      </span></button>`;
  }).join('') || '<div class="none">所有技能都满级了</div>';
  // 点一下选中，再点一次（或点下方按钮）确认，避免手机上误触
  $('u-cards').querySelectorAll('.card').forEach(el => el.onclick = () => {
    const i = +el.dataset.i;
    if (i === upSel) pick(i); else { upSel = i; renderCards(); }
  });
  const off = G.offers[upSel];
  $('b-pick').textContent = off ? `拿走「${CARD[off.id].name}」→ 商店` : '进入商店';
  const rb = $('b-reroll'); rb.innerHTML = `重抽<small>剩 ${G.rerolls} 次</small>`; rb.disabled = G.rerolls <= 0;
}
function showDead(nr) {
  const b = badge();
  $('d-badge').textContent = `称号「${b}」`;
  $('d-miss').innerHTML = G.missBy > 0 ? `<span>离第 ${G.round} 关结束${G.missBy < 10 ? '只' : '还'}差</span><b>${G.missBy.toFixed(1)}<small> 秒</small></b>` : '';
  $('d-stats').innerHTML = [['到达关卡', `第 ${G.round} 关`, 'var(--ink)'], ['威胁分', Math.round(G.threat).toLocaleString(), 'var(--fire)'],
    ['最高擦弹连击', G.maxCombo, 'var(--ice)'], ['冷却 Boss', G.bossCooled, 'var(--gold)']]
    .map(([l, v, c]) => `<div><span>${l}</span><b style="color:${c}">${v}</b></div>`).join('');
  const tags = [nr.threat && '威胁分', nr.round && '关卡', nr.combo && '擦弹连击'].filter(Boolean);
  $('d-rec').textContent = tags.length ? `新纪录：${tags.join('、')}！` : `最佳纪录：第 ${records.round} 关 · 威胁 ${records.threat.toLocaleString()} · 连击 ${records.combo}`;
  $('d-build').innerHTML = Object.entries(G.owned).map(([id, o]) => `<span style="--qc:${QSTYLE[o.q].b};--ql:${o.q ? QSTYLE[o.q].l : 'var(--ink)'}">${CARD[id].name} ${LV[o.L]}</span>`).join('')
    || '<span style="--qc:var(--line2);--ql:var(--dim)">没有获得技能</span>';
  $('d-share').value = `我在《疯狂火世界》撑到第 ${G.round} 关，威胁分 ${Math.round(G.threat)}，称号「${b}」。你来，你也过不了第二关！`;
  $('b-copy').textContent = '复制战绩';
  showScreen('s-dead');
}
function refreshTitle() {
  const R = records;
  $('t-rec').innerHTML = R.round || R.r2deaths
    ? `<div class="t-recs"><div><b style="color:var(--fire)">${R.r2deaths} 次</b><span>倒在第二关</span></div><div><b style="color:var(--ice)">第 ${R.round} 关</b><span>最远</span></div><div><b style="color:var(--gold)">${R.threat.toLocaleString()}</b><span>最高威胁</span></div></div>`
    : '<div class="t-first">第一次来？先撑过 24 秒的第一关。</div>';
}
function toggleSet(k) {
  settings[k] = !settings[k]; store.set('xc_settings', settings); refreshSet();
  if (master) master.gain.value = settings.mute ? 0 : .45;
  if (musicGain) musicGain.gain.value = settings.music ? .32 : 0;
}
const SETS = { mute: ['音效', 'sound'], music: ['音乐', 'music'], lowfx: ['低特效', 'lowfx'] };
function refreshSet() {
  document.querySelectorAll('[data-set]').forEach(b => {
    const k = b.dataset.set;
    if (k === 'drag') {
      // 操作方式：拖动跟手 / 摇杆，两种都是“开”的样子，只换图标和文字
      const t = settings.drag ? '拖动跟手' : '摇杆';
      b.classList.add('on'); b.classList.remove('off');
      b.setAttribute('aria-label', `操作方式：${t}，点击切换`);
      b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[settings.drag ? 'drag' : 'stick']}"/></svg><span>操作：${t}</span>`;
      return;
    }
    const on = k === 'mute' ? !settings.mute : settings[k], [label, ic] = SETS[k];
    b.classList.toggle('on', on); b.classList.toggle('off', !on);
    b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', `${label}：${on ? '开' : '关'}`);
    b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[ic]}"/>${on || k === 'lowfx' ? '' : '<path d="M4 4l16 16"/>'}</svg><span>${label} ${on ? '开' : '关'}</span>`;
  });
}
document.querySelectorAll('[data-set]').forEach(b => b.onclick = () => { audioInit(); toggleSet(b.dataset.set); });
$('b-start').onclick = start;
$('b-again').onclick = start;
$('b-resume').onclick = resume;
$('b-reroll').onclick = reroll;
$('b-pick').onclick = () => pick(upSel);
$('b-refresh').onclick = refreshShop;
$('b-go').onclick = leaveShop;
$('b-quit').onclick = () => { G = null; refreshTitle(); showScreen('s-title'); };
$('b-copy').onclick = () => {
  const ta = $('d-share');
  const done = () => { $('b-copy').textContent = '已复制'; };
  const fallback = () => { ta.focus(); ta.select(); $('b-copy').textContent = '已选中，请手动复制'; };
  try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch (e) { fallback(); }
};

// ───────── 主循环 ─────────
let last = performance.now();
function frame(now) {
  const rdt = Math.min(.05, (now - last) / 1000); last = now;
  if (G) update(rdt);
  render();
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize(); refreshSet(); refreshTitle();
requestAnimationFrame(frame);
// 调试入口：控制台里可查看状态、直接跳关、加金币
window.__fw = {
  get G() { return G; }, get P() { return P; }, get enemies() { return enemies; }, get sparks() { return sparks; },
  get grounds() { return grounds; }, get items() { return items; }, get shells() { return shells; }, get warns() { return warns; },
  jump(r) { G.round = r - 1; nextRound(); }, spawnItem, coins(n) { G.coins += n; },
  set touch(v) { touchMode = v; resize(); }
};
</script>
